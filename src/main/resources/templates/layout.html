<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (pageTitle, content, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: 'Movies App'">Movies App</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header class="site-header">
    <div class="logo">Movies App</div>
    <nav>
        <ul>
            <li><a th:href="@{/movies}">Фильмы</a></li>
            <li><a th:href="@{/persons}">Персоны</a></li>
            <li><a th:href="@{/locations}">Локации</a></li>
            <li><a th:href="@{/analytics}">Аналитика</a></li>
        </ul>
    </nav>
</header>
<main>
    <div th:replace="${content}"></div>
</main>
<div th:replace="${scripts}"></div>
</body>
</html>
