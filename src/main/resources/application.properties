spring.application.name=movies-app
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# Override these values with environment variables or application-local.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/movies}
spring.datasource.username=${DB_USERNAME:movies}
spring.datasource.password=${DB_PASSWORD:movies}

# EclipseLink
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.eclipse.persistence.platform.database.PostgreSQLPlatform
spring.jpa.properties.javax.persistence.provider=org.eclipse.persistence.jpa.PersistenceProvider
spring.jpa.properties.eclipselink.logging.level=${ECLIPSELINK_LOG_LEVEL:INFO}
spring.jpa.properties.eclipselink.logging.parameters=${ECLIPSELINK_LOG_PARAMETERS:false}
spring.jpa.properties.eclipselink.weaving=false
spring.jpa.properties.eclipselink.cache.shared.default=false

# Database migrations
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# JSON
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=8082
